  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

px 24px rgba(26, 22, 37, 0.08), 0 30px 80px rgba(83, 74, 183, 0.12);\n\n  --font-body: \"Nunito\", ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n  --font-display: \"Nunito\", ui-sans-serif, system-ui, -apple-system, sans-serif;\n  --font-serif: \"Fraunces\", ui-serif, Georgia, serif;\n\n  --container: 1240px;\n  --pad-x: clamp(20px, 4vw, 56px);\n}\n\n/* =============== RESET =============== */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { scroll-behavior: smooth; }\nbody {\n  margin: 0;\n  font-family: var(--font-body);\n  font-size: 17px;\n  line-height: 1.6;\n  color: var(--ink-2);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\nimg, svg { display: block; max-width: 100%; }\nbutton { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }\na { color: inherit; text-decoration: none; }\nul, ol { list-style: none; padding: 0; margin: 0; }\nh1, h2, h3, h4, h5 { margin: 0; color: var(--ink); font-family: var(--font-display); letter-spacing: -0.02em; }\np { margin: 0; }\n\n/* =============== LAYOUT =============== */\n.container {\n  width: 100%;\n  max-width: var(--container);\n  margin: 0 auto;\n  padding-inline: var(--pad-x);\n}\n.section { padding-block: clamp(80px, 9vw, 140px); position: relative; }\n.section--white { background: var(--bg); }\n.section--cream { background: var(--bg-cream); }\n.section--indigo {\n  background: var(--bg-indigo);\n  color: rgba(255,255,255,0.78);\n  position: relative;\n  overflow: hidden;\n}\n.section--indigo::before {\n  content: \"\";\n  position: absolute;\n  inset: -10%;\n  background:\n    radial-gradient(circle at 15% 20%, rgba(83,74,183,0.45), transparent 40%),\n    radial-gradient(circle at 85% 80%, rgba(7,129,160,0.30), transparent 45%);\n  pointer-events: none;\n}\n.section--indigo > .container { position: relative; }\n\n.section__head { max-width: 880px; margin-bottom: 56px; }\n.section__head--centered { margin-inline: auto; text-align: center; }\n.eyebrow {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  font-size: 13px;\n  font-weight: 700;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--indigo);\n  margin-bottom: 18px;\n}\n.eyebrow::before {\n  content: \"\";\n  width: 28px;\n  height: 2px;\n  background: var(--indigo);\n  border-radius: 2px;\n}\n.eyebrow--light { color: rgba(255,255,255,0.78); }\n.eyebrow--light::before { background: rgba(255,255,255,0.55); }\n\n.section__title {\n  font-size: clamp(36px, 5.5vw, 68px);\n  line-height: 1.02;\n  font-weight: 800;\n  color: var(--ink);\n  text-wrap: balance;\n}\n.section__title--light { color: #fff; }\n.section__title em {\n  font-style: italic;\n  font-family: var(--font-serif);\n  font-weight: 500;\n  color: var(--indigo);\n}\n.section__sub {\n  margin-top: 22px;\n  font-size: clamp(17px, 1.4vw, 20px);\n  line-height: 1.55;\n  color: var(--ink-3);\n  max-width: 620px;\n}\n.section__head--centered .section__sub { margin-inline: auto; }\n.section__sub--light { color: rgba(255,255,255,0.72); }\n\n.two-col {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 48px;\n  margin-bottom: 80px;\n  font-size: 18px;\n  line-height: 1.65;\n  color: var(--ink-3);\n  max-width: 1040px;\n}\n.two-col strong { color: var(--ink); font-weight: 700; }\n\n/* =============== BUTTONS =============== */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  font-weight: 700;\n  font-size: 15px;\n  padding: 14px 22px;\n  border-radius: 999px;\n  transition: transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease, border-color .15s ease;\n  white-space: nowrap;\n  letter-spacing: -0.005em;\n}\n.btn--primary {\n  background: var(--indigo);\n  color: #fff;\n  box-shadow: 0 1px 2px rgba(83,74,183,0.18), 0 8px 22px rgba(83,74,183,0.28);\n}\n.btn--primary:hover {\n  background: var(--indigo-deep);\n  transform: translateY(-1px);\n  box-shadow: 0 4px 8px rgba(83,74,183,0.22), 0 14px 30px rgba(83,74,183,0.32);\n}\n.btn--ghost {\n  background: transparent;\n  color: var(--ink);\n  border: 1.5px solid var(--line-strong);\n}\n.btn--ghost:hover { border-color: var(--ink); transform: translateY(-1px); }\n.btn--sm { padding: 10px 18px; font-size: 14px; }\n.btn--block { width: 100%; padding: 16px 22px; font-size: 16px; }\n\n/* =============== NAV =============== */\n.nav {\n  position: sticky;\n  top: 0;\n  z-index: 50;\n  background: rgba(255,255,255,0.78);\n  backdrop-filter: saturate(180%) blur(14px);\n  border-bottom: 1px solid transparent;\n  transition: border-color .2s ease, background .2s ease;\n}\n.nav.is-scrolled {\n  border-color: var(--line);\n  background: rgba(255,255,255,0.92);\n}\n.nav__inner {\n  display: flex;\n  align-items: center;\n  gap: 32px;\n  padding-block: 18px;\n}\n.brand { display: inline-flex; align-items: center; gap: 12px; }\n.brand__mark { display: inline-flex; }\n.brand__mark img { width: 56px; height: auto; display: block; }\n.brand__mark--footer img { width: 84px; }\n.brand__words { display: flex; flex-direction: column; line-height: 1; }\n.brand__line1 {\n  font-size: 17px;\n  font-weight: 800;\n  color: var(--ink);\n  letter-spacing: -0.01em;\n}\n.brand__line2 {\n  font-size: 11px;\n  font-weight: 700;\n  letter-spacing: 0.18em;\n  color: var(--indigo);\n  margin-top: 4px;\n  text-transform: uppercase;\n}\n.nav__links {\n  display: flex;\n  gap: 30px;\n  margin-inline: auto;\n}\n.nav__links a {\n  font-weight: 600;\n  font-size: 15px;\n  color: var(--ink-2);\n  position: relative;\n  padding: 6px 0;\n}\n.nav__links a:hover { color: var(--indigo); }\n.nav__cta { display: inline-flex; }\n.nav__toggle { display: none; flex-direction: column; gap: 5px; padding: 8px; }\n.nav__toggle span { width: 22px; height: 2px; background: var(--ink); border-radius: 2px; }\n.nav__mobile {\n  display: flex;\n  flex-direction: column;\n  gap: 4px;\n  padding: 12px var(--pad-x) 22px;\n  border-top: 1px solid var(--line);\n  background: #fff;\n}\n.nav__mobile[hidden] { display: none; }\n.nav__mobile a {\n  padding: 12px 8px;\n  font-weight: 600;\n  color: var(--ink);\n  border-bottom: 1px solid var(--line);\n}\n.nav__mobile .btn { margin-top: 12px; }\n\n/* =============== HERO =============== */\n.hero {\n  position: relative;\n  padding-top: clamp(40px, 7vw, 80px);\n  padding-bottom: clamp(80px, 11vw, 160px);\n  background:\n    radial-gradient(900px 500px at 90% 10%, rgba(67,164,149,0.10), transparent 60%),\n    radial-gradient(900px 600px at 10% 90%, rgba(83,74,183,0.10), transparent 60%),\n    linear-gradient(180deg, #FAF7F2 0%, #FFFFFF 100%);\n  overflow: hidden;\n}\n.hero__grid {\n  display: grid;\n  grid-template-columns: 1.05fr 1fr;\n  gap: clamp(40px, 6vw, 80px);\n  align-items: center;\n}\n.badge {\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  background: #fff;\n  border: 1px solid var(--line-strong);\n  padding: 8px 16px 8px 12px;\n  border-radius: 999px;\n  font-weight: 700;\n  font-size: 13px;\n  color: var(--ink);\n  letter-spacing: 0.01em;\n  margin-bottom: 28px;\n  box-shadow: var(--shadow-sm);\n}\n.badge__dot {\n  width: 8px;\n  height: 8px;\n  border-radius: 999px;\n  background: var(--green);\n  box-shadow: 0 0 0 4px rgba(67,164,149,0.18);\n  animation: pulse 2.4s ease-in-out infinite;\n}\n@keyframes pulse {\n  0%, 100% { box-shadow: 0 0 0 4px rgba(67,164,149,0.18); }\n  50% { box-shadow: 0 0 0 8px rgba(67,164,149,0.06); }\n}\n.hero__title {\n  font-size: clamp(44px, 7vw, 92px);\n  line-height: 0.98;\n  font-weight: 800;\n  letter-spacing: -0.03em;\n  margin-bottom: 24px;\n  text-wrap: balance;\n}\n.hero__title em {\n  font-family: var(--font-serif);\n  font-style: italic;\n  font-weight: 500;\n  color: var(--indigo);\n}\n.hero__sub {\n  font-size: clamp(18px, 1.5vw, 21px);\n  line-height: 1.55;\n  color: var(--ink-3);\n  max-width: 540px;\n  margin-bottom: 36px;\n}\n.hero__cta {\n  display: flex;\n  gap: 14px;\n  flex-wrap: wrap;\n  margin-bottom: 40px;\n}\n.hero__points {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px 24px;\n  font-size: 14px;\n  font-weight: 600;\n  color: var(--ink-2);\n}\n.hero__points li { display: inline-flex; align-items: center; gap: 8px; }\n.dot { display: inline-block; width: 8px; height: 8px; border-radius: 999px; }\n\n.hero__art {\n  position: relative;\n  aspect-ratio: 1 / 1;\n  max-width: 560px;\n  margin-inline: auto;\n  width: 100%;\n  display: grid;\n  place-items: center;\n}\n.hero__halo {\n  position: absolute;\n  inset: 6%;\n  border-radius: 50%;\n  background:\n    radial-gradient(circle at 50% 55%, rgba(83,74,183,0.10), transparent 60%),\n    radial-gradient(circle at 30% 30%, rgba(67,164,149,0.10), transparent 55%),\n    radial-gradient(circle at 75% 30%, rgba(153,92,160,0.10), transparent 55%);\n  filter: blur(10px);\n}\n.hero__logo {\n  position: relative;\n  width: 92%;\n  height: auto;\n  max-width: 520px;\n  filter: drop-shadow(0 30px 50px rgba(83,74,183,0.16)) drop-shadow(0 10px 20px rgba(26,22,37,0.06));\n  animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) both;\n}\n@keyframes rise {\n  from { opacity: 0; transform: translateY(20px); }\n  to   { opacity: 1; transform: translateY(0); }\n}\n.hero__divider {\n  position: absolute;\n  left: 0;\n  right: 0;\n  bottom: -1px;\n  width: 100%;\n  height: 60px;\n  display: block;\n}\n\n/* =============== AGE CARDS =============== */\n.ages {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 24px;\n}\n.age-card {\n  position: relative;\n  background: #fff;\n  border: 1px solid var(--line);\n  border-radius: var(--radius);\n  padding: 32px 28px 32px;\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n  transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;\n  overflow: hidden;\n}\n.age-card::before {\n  content: \"\";\n  position: absolute;\n  inset: 0 0 auto 0;\n  height: 4px;\n  background: var(--accent);\n}\n.age-card:hover {\n  transform: translateY(-4px);\n  box-shadow: var(--shadow);\n  border-color: transparent;\n}\n.age-card__num {\n  font-family: var(--font-serif);\n  font-style: italic;\n  font-size: 36px;\n  color: var(--accent);\n  font-weight: 500;\n  line-height: 1;\n  margin-bottom: 4px;\n}\n.age-card__range {\n  font-size: 12px;\n  font-weight: 800;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  color: var(--ink-3);\n}\n.age-card h3 {\n  font-size: 26px;\n  font-weight: 800;\n  line-height: 1.15;\n  margin-top: 6px;\n}\n.age-card p { color: var(--ink-3); font-size: 16px; line-height: 1.6; margin-top: 6px; }\n\n/* =============== SERVICES =============== */\n.services {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 1px;\n  background: var(--line);\n  border: 1px solid var(--line);\n  border-radius: var(--radius-lg);\n  overflow: hidden;\n}\n.service {\n  background: var(--bg-cream);\n  padding: 44px 40px 48px;\n  display: grid;\n  grid-template-columns: 80px 1fr;\n  gap: 24px;\n  position: relative;\n  transition: background .2s ease;\n}\n.service:hover { background: #fff; }\n.service__index { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }\n.service__num {\n  font-family: var(--font-serif);\n  font-style: italic;\n  font-weight: 500;\n  font-size: 40px;\n  color: var(--accent);\n  line-height: 1;\n}\n.service__rule {\n  width: 36px;\n  height: 3px;\n  background: var(--accent);\n  border-radius: 3px;\n}\n.service__body h3 {\n  font-size: 26px;\n  font-weight: 800;\n  line-height: 1.2;\n  margin-bottom: 12px;\n}\n.service__body p { color: var(--ink-3); line-height: 1.65; font-size: 16px; }\n\n/* =============== PHILOSOPHY =============== */\n.philosophy {\n  display: grid;\n  grid-template-columns: repeat(2, 1fr);\n  gap: 20px;\n}\n.phil-card {\n  background: rgba(255,255,255,0.05);\n  border: 1px solid rgba(255,255,255,0.10);\n  border-radius: var(--radius);\n  padding: 32px 32px 32px;\n  position: relative;\n  backdrop-filter: blur(6px);\n  transition: background .2s ease, border-color .2s ease, transform .2s ease;\n}\n.phil-card:hover {\n  background: rgba(255,255,255,0.08);\n  border-color: rgba(255,255,255,0.18);\n  transform: translateY(-2px);\n}\n.phil-card__mark {\n  display: block;\n  width: 36px;\n  height: 4px;\n  border-radius: 4px;\n  margin-bottom: 22px;\n}\n.phil-card h3 {\n  color: #fff;\n  font-size: 22px;\n  font-weight: 800;\n  margin-bottom: 12px;\n  line-height: 1.25;\n}\n.phil-card p { color: rgba(255,255,255,0.72); font-size: 15.5px; line-height: 1.6; }\n.phil-card--wide { grid-column: 1 / -1; }\n\n/* =============== VALUES =============== */\n.values {\n  display: grid;\n  grid-template-columns: repeat(5, 1fr);\n  gap: 0;\n  border-top: 1px solid var(--line);\n  border-bottom: 1px solid var(--line);\n}\n.value {\n  padding: 36px 24px 40px;\n  border-right: 1px solid var(--line);\n  position: relative;\n}\n.value:last-child { border-right: 0; }\n.value__num {\n  font-family: var(--font-serif);\n  font-style: italic;\n  font-weight: 500;\n  font-size: 14px;\n  color: var(--accent);\n  letter-spacing: 0.06em;\n  display: block;\n  margin-bottom: 16px;\n}\n.value h3 {\n  font-size: 26px;\n  font-weight: 800;\n  margin-bottom: 10px;\n  color: var(--ink);\n}\n.value p { color: var(--ink-3); font-size: 15px; line-height: 1.55; }\n.value::after {\n  content: \"\";\n  position: absolute;\n  left: 24px;\n  top: 0;\n  width: 36px;\n  height: 4px;\n  background: var(--accent);\n  border-radius: 0 0 4px 4px;\n}\n\n/* =============== STEPS =============== */\n.steps {\n  position: relative;\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 24px;\n  margin-top: 32px;\n}\n.steps__arch {\n  position: absolute;\n  left: 0; right: 0; top: -10px;\n  width: 100%;\n  height: 200px;\n  pointer-events: none;\n}\n.step {\n  background: #fff;\n  border: 1px solid var(--line);\n  border-radius: var(--radius);\n  padding: 28px 24px 30px;\n  position: relative;\n  transition: transform .2s ease, box-shadow .2s ease;\n}\n.step:hover { transform: translateY(-3px); box-shadow: var(--shadow); }\n.step__node {\n  width: 56px;\n  height: 56px;\n  border-radius: 50%;\n  background: var(--accent);\n  color: #fff;\n  display: grid;\n  place-items: center;\n  font-family: var(--font-serif);\n  font-style: italic;\n  font-weight: 500;\n  font-size: 28px;\n  margin-bottom: 22px;\n  box-shadow: 0 8px 20px color-mix(in oklch, var(--accent) 40%, transparent);\n  position: relative;\n  z-index: 2;\n}\n.step h3 { font-size: 20px; font-weight: 800; margin-bottom: 10px; line-height: 1.25; }\n.step p { color: var(--ink-3); font-size: 15.5px; line-height: 1.55; }\n.steps__note {\n  max-width: 760px;\n  margin: 56px auto 0;\n  text-align: center;\n  color: var(--ink-3);\n  font-size: 15px;\n  padding: 18px 24px;\n  border: 1px dashed var(--line-strong);\n  border-radius: var(--radius);\n  background: rgba(255,255,255,0.5);\n}\n.steps__note strong { color: var(--ink); }\n\n/* =============== SERVE / STATS =============== */\n.serve {\n  display: grid;\n  grid-template-columns: 1.1fr 1fr;\n  gap: clamp(40px, 6vw, 80px);\n  align-items: center;\n}\n.serve__copy p { color: var(--ink-3); font-size: 17px; line-height: 1.65; margin-top: 22px; max-width: 520px; }\n.serve__stats {\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: 16px;\n}\n.stat {\n  position: relative;\n  border: 1px solid var(--line);\n  border-radius: var(--radius);\n  padding: 28px 32px;\n  display: grid;\n  grid-template-columns: 1fr auto;\n  align-items: center;\n  background: var(--bg-cream);\n  overflow: hidden;\n}\n.stat__bar {\n  position: absolute;\n  left: 0; top: 0; bottom: 0;\n  width: 6px;\n  background: var(--accent);\n}\n.stat__num {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: clamp(48px, 5vw, 64px);\n  line-height: 1;\n  letter-spacing: -0.04em;\n  color: var(--ink);\n}\n.stat__num span { color: var(--ink-3); font-size: 0.5em; font-weight: 700; }\n.stat__num--small { font-size: clamp(28px, 3vw, 36px); letter-spacing: -0.02em; }\n.stat__lbl {\n  font-size: 13px;\n  font-weight: 800;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--ink-3);\n  text-align: right;\n}\n\n/* =============== FAQ =============== */\n.faq-wrap {\n  display: grid;\n  grid-template-columns: 360px 1fr;\n  gap: clamp(40px, 6vw, 80px);\n  align-items: start;\n}\n.faq__side { position: sticky; top: 96px; }\n.faq__side .section__sub { margin-bottom: 28px; }\n\n.faq { border-top: 1px solid var(--line); }\n.faq__item { border-bottom: 1px solid var(--line); }\n.faq__q {\n  width: 100%;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 24px;\n  text-align: left;\n  padding: 24px 4px;\n  font-size: clamp(17px, 1.4vw, 19px);\n  font-weight: 700;\n  color: var(--ink);\n  transition: color .15s ease;\n}\n.faq__q:hover { color: var(--indigo); }\n.faq__icon {\n  flex: none;\n  width: 28px;\n  height: 28px;\n  border-radius: 999px;\n  background: var(--indigo-soft);\n  position: relative;\n  transition: background .2s ease, transform .2s ease;\n}\n.faq__icon::before, .faq__icon::after {\n  content: \"\";\n  position: absolute;\n  background: var(--indigo);\n  border-radius: 2px;\n  left: 50%; top: 50%;\n}\n.faq__icon::before { width: 12px; height: 2px; transform: translate(-50%, -50%); }\n.faq__icon::after { width: 2px; height: 12px; transform: translate(-50%, -50%); transition: transform .2s ease; }\n.faq__q[aria-expanded=\"true\"] .faq__icon { background: var(--indigo); }\n.faq__q[aria-expanded=\"true\"] .faq__icon::before { background: #fff; }\n.faq__q[aria-expanded=\"true\"] .faq__icon::after { transform: translate(-50%, -50%) scaleY(0); background: #fff; }\n.faq__a {\n  display: grid;\n  grid-template-rows: 0fr;\n  transition: grid-template-rows .3s ease;\n}\n.faq__a > p {\n  overflow: hidden;\n  color: var(--ink-3);\n  font-size: 16px;\n  line-height: 1.65;\n  padding-right: 56px;\n}\n.faq__q[aria-expanded=\"true\"] + .faq__a {\n  grid-template-rows: 1fr;\n}\n.faq__q[aria-expanded=\"true\"] + .faq__a > p { padding-bottom: 24px; }\n\n/* =============== CAREERS =============== */\n.careers {\n  display: grid;\n  grid-template-columns: 1fr 1.05fr;\n  gap: clamp(40px, 6vw, 80px);\n  align-items: start;\n}\n.careers__head p { color: var(--ink-3); font-size: 17px; line-height: 1.65; margin-top: 22px; max-width: 480px; }\n.careers__head .btn { margin-top: 32px; }\n.careers__roles { display: grid; gap: 16px; }\n.role {\n  background: #fff;\n  border: 1px solid var(--line);\n  border-radius: var(--radius);\n  padding: 32px 32px 28px;\n  position: relative;\n  border-left: 4px solid var(--accent);\n  transition: transform .2s ease, box-shadow .2s ease;\n}\n.role:hover { transform: translateY(-2px); box-shadow: var(--shadow); }\n.role__tag {\n  display: inline-block;\n  font-size: 11px;\n  font-weight: 800;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  color: var(--accent);\n  background: color-mix(in oklch, var(--accent) 12%, white);\n  padding: 5px 10px;\n  border-radius: 999px;\n  margin-bottom: 14px;\n}\n.role h3 {\n  font-size: 26px;\n  font-weight: 800;\n  line-height: 1.15;\n  margin-bottom: 10px;\n}\n.role p { color: var(--ink-3); font-size: 15.5px; line-height: 1.55; margin-bottom: 22px; }\n.role__meta {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 10px 24px;\n  padding-top: 18px;\n  border-top: 1px dashed var(--line-strong);\n}\n.role__meta li { font-size: 14px; color: var(--ink-3); }\n.role__meta strong { color: var(--ink); font-weight: 800; margin-right: 4px; }\n\n/* =============== CONTACT =============== */\n.section--contact {\n  background: linear-gradient(180deg, #FAF7F2 0%, #FFFFFF 100%);\n}\n.contact {\n  display: grid;\n  grid-template-columns: 1fr 1.1fr;\n  gap: clamp(40px, 6vw, 80px);\n  align-items: start;\n}\n.contact__copy { padding-top: 8px; }\n.contact__assurances {\n  margin-top: 32px;\n  display: grid;\n  gap: 10px;\n  font-size: 16px;\n  line-height: 1.35;\n  color: var(--ink-3);\n}\n.contact__assurances > div { display: flex; align-items: center; gap: 12px; }\n.contact__assurances strong { color: var(--ink); font-weight: 700; }\n\n.form {\n  background: #fff;\n  border: 1px solid var(--line);\n  border-radius: var(--radius-lg);\n  padding: 36px;\n  box-shadow: var(--shadow-lg);\n}\n.form__row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }\n.field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }\n.field > span {\n  font-size: 13px;\n  font-weight: 700;\n  letter-spacing: 0.06em;\n  color: var(--ink-2);\n  text-transform: uppercase;\n}\n.field input,\n.field textarea,\n.field select {\n  font: inherit;\n  font-size: 16px;\n  font-family: var(--font-body);\n  background: var(--bg-cream);\n  border: 1.5px solid transparent;\n  border-radius: 12px;\n  padding: 14px 16px;\n  color: var(--ink);\n  outline: none;\n  transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;\n  width: 100%;\n  resize: vertical;\n}\n.field input::placeholder,\n.field textarea::placeholder { color: var(--muted); }\n.field input:focus,\n.field textarea:focus,\n.field select:focus {\n  border-color: var(--indigo);\n  background: #fff;\n  box-shadow: 0 0 0 4px rgba(83,74,183,0.10);\n}\n.select { position: relative; }\n.select select {\n  appearance: none;\n  -webkit-appearance: none;\n  padding-right: 44px;\n}\n.select svg {\n  position: absolute;\n  right: 16px;\n  top: 50%;\n  transform: translateY(-50%);\n  color: var(--ink-3);\n  pointer-events: none;\n}\n.form__note {\n  margin-top: 16px;\n  font-size: 13px;\n  color: var(--ink-3);\n  text-align: center;\n}\n.form.is-sent .btn--block { background: var(--green); pointer-events: none; }\n.form.is-sent .btn--block svg { transform: translateX(4px); transition: transform .3s ease; }\n\n/* =============== FOOTER =============== */\n.footer {\n  background: var(--bg-indigo);\n  color: rgba(255,255,255,0.72);\n  padding-top: 80px;\n  position: relative;\n  overflow: hidden;\n}\n.footer::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background:\n    radial-gradient(800px 400px at 80% 0%, rgba(83,74,183,0.30), transparent 50%),\n    radial-gradient(800px 400px at 10% 100%, rgba(7,129,160,0.20), transparent 50%);\n  pointer-events: none;\n}\n.footer__inner {\n  position: relative;\n  display: grid;\n  grid-template-columns: 1.4fr 1fr 1fr;\n  gap: 48px;\n  padding-bottom: 64px;\n  border-bottom: 1px solid rgba(255,255,255,0.10);\n}\n.footer__brand { display: flex; gap: 18px; align-items: flex-start; }\n.footer__name { display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 1.55; }\n.footer__name strong { color: #fff; font-size: 16px; font-weight: 800; }\n.footer__lbl {\n  display: block;\n  font-size: 12px;\n  font-weight: 800;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: rgba(255,255,255,0.55);\n  margin-bottom: 14px;\n}\n.footer__contact, .footer__links { display: flex; flex-direction: column; gap: 10px; font-size: 15px; }\n.footer__contact a, .footer__links a {\n  color: rgba(255,255,255,0.78);\n  transition: color .15s ease;\n}\n.footer__contact a:hover, .footer__links a:hover { color: #fff; }\n.footer__bottom { position: relative; }\n.footer__bottom__inner {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  gap: 16px;\n  padding-block: 24px;\n  color: rgba(255,255,255,0.5);\n  font-size: 13px;\n}\n.footer__tag { display: inline-flex; align-items: center; gap: 6px; }\n.footer__tag .dot { width: 7px; height: 7px; }\n\n/* =============== RESPONSIVE =============== */\n@media (max-width: 1080px) {\n  .nav__links { display: none; }\n  .nav__cta { display: none; }\n  .nav__toggle { display: inline-flex; margin-left: auto; }\n  .nav.is-open .nav__mobile { display: flex; }\n  .hero__grid { grid-template-columns: 1fr; gap: 40px; }\n  .hero__art { max-width: 480px; }\n  .services { grid-template-columns: 1fr; }\n  .philosophy { grid-template-columns: 1fr; }\n  .values { grid-template-columns: repeat(2, 1fr); }\n  .value { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }\n  .value:nth-child(2n) { border-right: 0; }\n  .value:last-child { grid-column: 1 / -1; }\n  .steps { grid-template-columns: repeat(2, 1fr); }\n  .steps__arch { display: none; }\n  .serve { grid-template-columns: 1fr; }\n  .faq-wrap { grid-template-columns: 1fr; }\n  .faq__side { position: static; }\n  .careers { grid-template-columns: 1fr; }\n  .contact { grid-template-columns: 1fr; }\n  .footer__inner { grid-template-columns: 1fr 1fr; }\n  .footer__brand { grid-column: 1 / -1; }\n}\n@media (max-width: 640px) {\n  .ages { grid-template-columns: 1fr; }\n  .service { grid-template-columns: 1fr; padding: 32px 24px; }\n  .values { grid-template-columns: 1fr; }\n  .value { border-right: 0; }\n  .steps { grid-template-columns: 1fr; }\n  .form { padding: 24px; }\n  .form__row { grid-template-columns: 1fr; }\n  .footer__inner { grid-template-columns: 1fr; }\n  .footer__bottom__inner { flex-direction: column; align-items: flex-start; }\n  .two-col { grid-template-columns: 1fr; gap: 20px; margin-bottom: 56px; }\n  .role__meta { grid-template-columns: 1fr; }\n  .stat { padding: 22px 24px; }\n  .stat__lbl { text-align: left; font-size: 11px; }\n}\n\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- ============ NAV ============ -->\n<header class=\"nav\" id=\"nav\">\n  <div class=\"container nav__inner\">\n    <a href=\"#top\" class=\"brand\" aria-label=\"Building Bridges ABA, home\">\n      <span class=\"brand__mark\" aria-hidden=\"true\">\n        <img src=\"e47e84a5-ddc4-484b-be56-c6dea4153f29\" alt=\"\" width=\"56\" height=\"35\">\n      <\u002Fspan>\n      <span class=\"brand__words\">\n        <span class=\"brand__line1\">Building Bridges<\u002Fspan>\n        <span class=\"brand__line2\">Behavior Therapy<\u002Fspan>\n      <\u002Fspan>\n    <\u002Fa>\n\n    <nav class=\"nav__links\" aria-label=\"Primary\">\n      <a href=\"#about\">About<\u002Fa>\n      <a href=\"#services\">Services<\u002Fa>\n      <a href=\"#faq\">FAQ<\u002Fa>\n      <a href=\"#careers\">Join Our Team<\u002Fa>\n    <\u002Fnav>\n\n    <a href=\"#contact\" class=\"btn btn--primary btn--sm nav__cta\">Get Started<\u002Fa>\n\n    <button class=\"nav__toggle\" id=\"navToggle\" aria-label=\"Open menu\" aria-expanded=\"false\">\n      <span><\u002Fspan><span><\u002Fspan><span><\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"nav__mobile\" id=\"navMobile\" hidden=\"\">\n    <a href=\"#about\">About<\u002Fa>\n    <a href=\"#services\">Services<\u002Fa>\n    <a href=\"#faq\">FAQ<\u002Fa>\n    <a href=\"#careers\">Join Our Team<\u002Fa>\n    <a href=\"#contact\" class=\"btn btn--primary\">Get Started<\u002Fa>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main id=\"top\">\n\n<!-- ============ HERO ============ -->\n<section class=\"hero\">\n  <div class=\"container hero__grid\">\n    <div class=\"hero__copy\">\n      <span class=\"badge\">\n        <span class=\"badge__dot\"><\u002Fspan>\n        Now Accepting New Clients\n      <\u002Fspan>\n      <h1 class=\"hero__title\">\n        Where every child<br>\n        finds their <em>bridge<\u002Fem>.\n      <\u002Fh1>\n      <p class=\"hero__sub\">\n        Home-based, compassionate ABA therapy for children and families in Northeast Ohio, delivered where your child feels most at home.\n      <\u002Fp>\n      <div class=\"hero__cta\">\n        <a href=\"#contact\" class=\"btn btn--primary\">Get Started<\u002Fa>\n        <a href=\"#services\" class=\"btn btn--ghost\">Learn More\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\"><path d=\"M5 12h14M13 5l7 7-7 7\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n      <\u002Fdiv>\n      <ul class=\"hero__points\" aria-label=\"At a glance\">\n        <li><span class=\"dot\" style=\"background:#0781A0\"><\u002Fspan>BCBA-led care<\u002Fli>\n        <li><span class=\"dot\" style=\"background:#43A495\"><\u002Fspan>100% home-based<\u002Fli>\n        <li><span class=\"dot\" style=\"background:#995CA0\"><\u002Fspan>Neurodiversity-affirming<\u002Fli>\n        <li><span class=\"dot\" style=\"background:#F4932E\"><\u002Fspan>Ages 2 to 21<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <div class=\"hero__art\" aria-hidden=\"true\">\n      <div class=\"hero__halo\"><\u002Fdiv>\n      <img src=\"e47e84a5-ddc4-484b-be56-c6dea4153f29\" alt=\"\" class=\"hero__logo\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- subtle bottom arch divider -->\n  <svg class=\"hero__divider\" viewBox=\"0 0 1440 60\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\n    <path d=\"M0 60 Q720 0 1440 60 Z\" fill=\"#FFFFFF\"><\u002Fpath>\n  <\u002Fsvg>\n<\u002Fsection>\n\n<!-- ============ WHAT IS ABA ============ -->\n<section class=\"section section--white\" id=\"about\">\n  <div class=\"container\">\n    <div class=\"section__head\">\n      <span class=\"eyebrow\">What Is ABA?<\u002Fspan>\n      <h2 class=\"section__title\">The science of helping<br>children grow.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"section__intro two-col\">\n      <p>\n        Applied Behavior Analysis (ABA) is an evidence-based therapy that helps children build communication, social, and life skills while reducing challenging behaviors that get in the way of learning and connection.\n      <\u002Fp>\n      <p>\n        ABA looks at each child as an individual. It finds the what and the why behind behaviors, then replaces the ones holding your child back with skills that move them forward. <strong>We serve children and young adults ages 2 to 21.<\u002Fstrong>\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"ages\">\n      <article class=\"age-card\" style=\"--accent:#0781A0\">\n        <div class=\"age-card__num\">01<\u002Fdiv>\n        <div class=\"age-card__range\">Ages 2–6<\u002Fdiv>\n        <h3>Early Intervention<\u002Fh3>\n        <p>Building foundational communication, play skills, and school readiness from the ground up.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"age-card\" style=\"--accent:#43A495\">\n        <div class=\"age-card__num\">02<\u002Fdiv>\n        <div class=\"age-card__range\">Ages 7–12<\u002Fdiv>\n        <h3>Pre-Adolescent<\u002Fh3>\n        <p>Expanding communication, building life skills, and supporting independence at home and in school.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"age-card\" style=\"--accent:#995CA0\">\n        <div class=\"age-card__num\">03<\u002Fdiv>\n        <div class=\"age-card__range\">Ages 13–21<\u002Fdiv>\n        <h3>Adolescent &amp; Young Adult<\u002Fh3>\n        <p>Focusing on independence, self-care, social skills, and preparing for adult life.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ SERVICES ============ -->\n<section class=\"section section--cream\" id=\"services\">\n  <div class=\"container\">\n    <div class=\"section__head section__head--centered\">\n      <span class=\"eyebrow\">What We Offer<\u002Fspan>\n      <h2 class=\"section__title\">Evidence-based care,<br>delivered at home.<\u002Fh2>\n      <p class=\"section__sub\">Every service we provide is individualized, family-centered, and grounded in the science of Applied Behavior Analysis.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"services\">\n      <article class=\"service\" style=\"--accent:#0781A0\">\n        <div class=\"service__index\">\n          <span class=\"service__num\">01<\u002Fspan>\n          <span class=\"service__rule\"><\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"service__body\">\n          <h3>Behavioral Assessments<\u002Fh3>\n          <p>Before therapy begins, your child's BCBA conducts a thorough, individualized evaluation to identify your child's unique strengths, needs, and learning profile. This assessment is the foundation of every treatment plan we build. Nothing about your child's program is generic.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"service\" style=\"--accent:#43A495\">\n        <div class=\"service__index\">\n          <span class=\"service__num\">02<\u002Fspan>\n          <span class=\"service__rule\"><\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"service__body\">\n          <h3>Home-Based ABA Therapy<\u002Fh3>\n          <p>Direct ABA services are delivered in your home, the most natural environment for children to learn. Your child works one-on-one with a behavior technician who implements a program designed and supervised by their BCBA. Sessions focus on communication, daily living, social skills, play, and behavior support based on your child's individual goals.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"service\" style=\"--accent:#995CA0\">\n        <div class=\"service__index\">\n          <span class=\"service__num\">03<\u002Fspan>\n          <span class=\"service__rule\"><\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"service__body\">\n          <h3>BCBA Supervision &amp; Program Oversight<\u002Fh3>\n          <p>Your child's BCBA oversees every aspect of their program. This includes reviewing data, adjusting treatment procedures, training your child's behavior technician, and making all clinical decisions. BCBA supervision may occur in person or over secure video. Your family will always be informed before any remote observation takes place.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"service\" style=\"--accent:#F4932E\">\n        <div class=\"service__index\">\n          <span class=\"service__num\">04<\u002Fspan>\n          <span class=\"service__rule\"><\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"service__body\">\n          <h3>Family &amp; Caregiver Training<\u002Fh3>\n          <p>Family involvement is not optional at Building Bridges ABA. It is essential. Your BCBA meets with you regularly to share strategies, review your child's progress, and build your confidence in supporting your child between sessions. Research is clear: children make faster, more lasting progress when families can apply the same strategies throughout the day.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ PHILOSOPHY ============ -->\n<section class=\"section section--indigo\">\n  <div class=\"container\">\n    <div class=\"section__head\">\n      <span class=\"eyebrow eyebrow--light\">Our Philosophy<\u002Fspan>\n      <h2 class=\"section__title section__title--light\">Therapy built<br>on partnership.<\u002Fh2>\n      <p class=\"section__sub section__sub--light\">At Building Bridges ABA, we believe every child deserves services that respect who they are. Our approach to ABA is grounded in the following principles.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"philosophy\">\n      <article class=\"phil-card\">\n        <span class=\"phil-card__mark\" style=\"background:#0781A0\"><\u002Fspan>\n        <h3>Neurodiversity-Affirming Practice<\u002Fh3>\n        <p>We recognize that autism is a natural part of human diversity. Our goals focus on improving quality of life, expanding choice, and supporting participation rather than eliminating autistic identity. We do not try to make autistic children seem less autistic.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"phil-card\">\n        <span class=\"phil-card__mark\" style=\"background:#43A495\"><\u002Fspan>\n        <h3>Assent-Based Care<\u002Fh3>\n        <p>Your child's comfort and willingness to participate matter at every session. We actively monitor whether your child is engaged and at ease, and we adjust our approach when they are not. A child who is not willing is telling us something important.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"phil-card\">\n        <span class=\"phil-card__mark\" style=\"background:#995CA0\"><\u002Fspan>\n        <h3>Client Dignity<\u002Fh3>\n        <p>Every child is treated with respect, kindness, and unconditional positive regard. Coercive or demeaning approaches have no place in our practice, period.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"phil-card\">\n        <span class=\"phil-card__mark\" style=\"background:#F4932E\"><\u002Fspan>\n        <h3>Naturalistic Teaching<\u002Fh3>\n        <p>We prioritize learning in the real environments where skills will actually be used, including your home, your routines, and your family's daily life. Skills learned in context stick.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"phil-card phil-card--wide\">\n        <span class=\"phil-card__mark\" style=\"background:linear-gradient(90deg,#0781A0,#43A495,#995CA0,#F4932E)\"><\u002Fspan>\n        <h3>Family Collaboration<\u002Fh3>\n        <p>You know your child best. We work with you, not around you. Your input shapes your child's goals, programming, and progress. You are not a passive observer. You are a partner.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ VALUES ============ -->\n<section class=\"section section--white\">\n  <div class=\"container\">\n    <div class=\"section__head\">\n      <span class=\"eyebrow\">Our Values<\u002Fspan>\n      <h2 class=\"section__title\">What we stand for.<\u002Fh2>\n    <\u002Fdiv>\n\n    <ol class=\"values\">\n      <li class=\"value\" style=\"--accent:#534AB7\">\n        <span class=\"value__num\">01<\u002Fspan>\n        <h3>Dignity<\u002Fh3>\n        <p>Every child and family is treated with respect, kindness, and unconditional positive regard.<\u002Fp>\n      <\u002Fli>\n      <li class=\"value\" style=\"--accent:#0781A0\">\n        <span class=\"value__num\">02<\u002Fspan>\n        <h3>Evidence<\u002Fh3>\n        <p>Our clinical decisions are grounded in the science of behavior analysis and the best available research.<\u002Fp>\n      <\u002Fli>\n      <li class=\"value\" style=\"--accent:#43A495\">\n        <span class=\"value__num\">03<\u002Fspan>\n        <h3>Partnership<\u002Fh3>\n        <p>Families are not passive recipients of services. You are active collaborators in your child's care.<\u002Fp>\n      <\u002Fli>\n      <li class=\"value\" style=\"--accent:#995CA0\">\n        <span class=\"value__num\">04<\u002Fspan>\n        <h3>Equity<\u002Fh3>\n        <p>We are committed to serving all families with fairness, cultural humility, and without discrimination.<\u002Fp>\n      <\u002Fli>\n      <li class=\"value\" style=\"--accent:#F4932E\">\n        <span class=\"value__num\">05<\u002Fspan>\n        <h3>Growth<\u002Fh3>\n        <p>We hold high expectations for every child, and we continuously improve our own knowledge and practice.<\u002Fp>\n      <\u002Fli>\n    <\u002Fol>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ HOW IT WORKS ============ -->\n<section class=\"section section--cream\">\n  <div class=\"container\">\n    <div class=\"section__head section__head--centered\">\n      <span class=\"eyebrow\">How It Works<\u002Fspan>\n      <h2 class=\"section__title\">What to expect.<\u002Fh2>\n      <p class=\"section__sub\">We want families to feel informed and prepared. Here is an honest look at the process from first contact to first session.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"steps\">\n      <svg class=\"steps__arch\" viewBox=\"0 0 1200 200\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\n        <path d=\"M80 170 Q600 -20 1120 170\" fill=\"none\" stroke=\"#534AB7\" stroke-opacity=\"0.18\" stroke-width=\"2\" stroke-dasharray=\"4 8\"><\u002Fpath>\n      <\u002Fsvg>\n\n      <article class=\"step\" style=\"--accent:#0781A0\">\n        <div class=\"step__node\"><span>1<\u002Fspan><\u002Fdiv>\n        <h3>Reach Out<\u002Fh3>\n        <p>Fill out our contact form or have your child's physician or school professional submit a referral. We complete an intake and verify your insurance benefits.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"step\" style=\"--accent:#43A495\">\n        <div class=\"step__node\"><span>2<\u002Fspan><\u002Fdiv>\n        <h3>Authorization &amp; Assessment<\u002Fh3>\n        <p>We work with your insurance to obtain authorization for an initial assessment. Once approved, your BCBA conducts a thorough evaluation of your child.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"step\" style=\"--accent:#995CA0\">\n        <div class=\"step__node\"><span>3<\u002Fspan><\u002Fdiv>\n        <h3>Treatment Plan<\u002Fh3>\n        <p>Your BCBA develops an individualized treatment plan based on the assessment. That plan is submitted to insurance for approval before services begin.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"step\" style=\"--accent:#F4932E\">\n        <div class=\"step__node\"><span>4<\u002Fspan><\u002Fdiv>\n        <h3>Services Begin<\u002Fh3>\n        <p>Once your treatment plan is approved, therapy starts. Your family is involved every step of the way, with regular caregiver training built into the process.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n\n    <p class=\"steps__note\">\n      <strong>A note on timelines:<\u002Fstrong> Insurance authorization can take time and is largely outside our control. We will keep you informed at every stage and advocate on your behalf throughout the process.\n    <\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ WHERE WE SERVE ============ -->\n<section class=\"section section--white\">\n  <div class=\"container serve\">\n    <div class=\"serve__copy\">\n      <span class=\"eyebrow\">Where We Work<\u002Fspan>\n      <h2 class=\"section__title\">Proudly serving<br>Northeast Ohio.<\u002Fh2>\n      <p>\n        We bring our services directly to families across Northeast Ohio, including Mahoning, Trumbull, and surrounding counties. No clinic, no commute, no disruption to your routine.\n      <\u002Fp>\n      <p>\n        Building Bridges Behavior Therapy, LLC is a home-based agency. We do not operate a clinic or center. All services are delivered in your home and, when appropriate, in natural community settings.\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"serve__stats\">\n      <div class=\"stat\">\n        <div class=\"stat__num\">2–21<\u002Fdiv>\n        <div class=\"stat__lbl\">Ages Served<\u002Fdiv>\n        <span class=\"stat__bar\" style=\"background:#0781A0\"><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"stat\">\n        <div class=\"stat__num\">100<span>%<\u002Fspan><\u002Fdiv>\n        <div class=\"stat__lbl\">Home-Based<\u002Fdiv>\n        <span class=\"stat__bar\" style=\"background:#43A495\"><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"stat\">\n        <div class=\"stat__num stat__num--small\">BCBA-Led<\u002Fdiv>\n        <div class=\"stat__lbl\">Every Program<\u002Fdiv>\n        <span class=\"stat__bar\" style=\"background:#F4932E\"><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FAQ ============ -->\n<section class=\"section section--white\" id=\"faq\">\n  <div class=\"container faq-wrap\">\n    <aside class=\"faq__side\">\n      <span class=\"eyebrow\">FAQ<\u002Fspan>\n      <h2 class=\"section__title\">Questions<br>we hear most.<\u002Fh2>\n      <p class=\"section__sub\">If you do not see your question here, reach out. We are always happy to talk.<\u002Fp>\n      <a href=\"#contact\" class=\"btn btn--primary\">Ask Us Anything<\u002Fa>\n    <\u002Faside>\n\n    <ul class=\"faq\" id=\"faqList\">\n      <li class=\"faq__item\">\n        <button class=\"faq__q\" aria-expanded=\"false\"><span>What is ABA therapy?<\u002Fspan><span class=\"faq__icon\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq__a\"><p>Applied Behavior Analysis (ABA) is an evidence-based therapy that helps children build communication, social, and life skills while reducing challenging behaviors. It is the most researched and widely recommended treatment for children with autism, endorsed by the US Surgeon General and the American Academy of Pediatrics.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li class=\"faq__item\">\n        <button class=\"faq__q\" aria-expanded=\"false\"><span>How do I get started?<\u002Fspan><span class=\"faq__icon\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq__a\"><p>Fill out our contact form and we will reach out within one to two business days. You can also have your child's physician or school professional submit a referral. From there, we will walk you through every step of the process.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li class=\"faq__item\">\n        <button class=\"faq__q\" aria-expanded=\"false\"><span>Does my child need an autism diagnosis?<\u002Fspan><span class=\"faq__icon\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq__a\"><p>Yes. A formal diagnosis of Autism Spectrum Disorder (ASD) is required by insurance providers to authorize ABA services. If your child does not yet have a diagnosis, we can help point you in the right direction.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li class=\"faq__item\">\n        <button class=\"faq__q\" aria-expanded=\"false\"><span>Do you accept insurance?<\u002Fspan><span class=\"faq__icon\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq__a\"><p>We accept Ohio Medicaid managed care plans and are credentialing with commercial insurance providers. Reach out and we can discuss your specific insurance situation and timeline.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li class=\"faq__item\">\n        <button class=\"faq__q\" aria-expanded=\"false\"><span>What ages do you serve?<\u002Fspan><span class=\"faq__icon\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq__a\"><p>We serve children and young adults from ages 2 to 21. Our approach is tailored to each stage of development, from early intervention through adolescence and into young adulthood.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li class=\"faq__item\">\n        <button class=\"faq__q\" aria-expanded=\"false\"><span>Where do sessions take place?<\u002Fspan><span class=\"faq__icon\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq__a\"><p>All sessions are delivered in your home. We believe children learn best in the environment where they actually live. Community-based sessions, such as practicing skills at a park or store, may also be incorporated into your child's plan.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li class=\"faq__item\">\n        <button class=\"faq__q\" aria-expanded=\"false\"><span>What is expected of me as a caregiver?<\u002Fspan><span class=\"faq__icon\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq__a\"><p>Family involvement is a core part of what we do. Caregivers participate in regular training sessions so they can support their child's progress between sessions. You do not need any prior experience with ABA. We will teach you everything you need to know.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li class=\"faq__item\">\n        <button class=\"faq__q\" aria-expanded=\"false\"><span>Is ABA therapy a cure for autism?<\u002Fspan><span class=\"faq__icon\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq__a\"><p>No. ABA is not a cure, and we would never present it as one. What ABA does is help your child build skills and reduce barriers so they can participate more fully in daily life. Progress looks different for every child, and we celebrate every step forward, no matter how small.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li class=\"faq__item\">\n        <button class=\"faq__q\" aria-expanded=\"false\"><span>What is a BCBA?<\u002Fspan><span class=\"faq__icon\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq__a\"><p>A Board Certified Behavior Analyst (BCBA) is a master's level clinician with specialized training in the science of behavior. BCBAs design, oversee, and continuously adjust your child's treatment plan based on ongoing data and clinical judgment.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li class=\"faq__item\">\n        <button class=\"faq__q\" aria-expanded=\"false\"><span>Why does BCBA oversight matter?<\u002Fspan><span class=\"faq__icon\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq__a\"><p>Your child's needs change over time. Active BCBA oversight means the treatment plan is regularly reviewed, updated, and adapted, not just carried out on autopilot. It is the difference between a program that works and one that works for your child specifically.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li class=\"faq__item\">\n        <button class=\"faq__q\" aria-expanded=\"false\"><span>How much does it cost?<\u002Fspan><span class=\"faq__icon\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq__a\"><p>We bill directly to insurance. Families enrolled in Medicaid typically have no out of pocket cost for covered services. Contact us and we will help you understand your specific benefits and coverage.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li class=\"faq__item\">\n        <button class=\"faq__q\" aria-expanded=\"false\"><span>How long are therapy sessions?<\u002Fspan><span class=\"faq__icon\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq__a\"><p>Session length varies based on your child's treatment plan and insurance authorization. Most direct therapy sessions range from two to five hours. Your BCBA will recommend a schedule that fits your child's needs and your family's routine.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li class=\"faq__item\">\n        <button class=\"faq__q\" aria-expanded=\"false\"><span>Will my child have the same behavior technician each visit?<\u002Fspan><span class=\"faq__icon\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq__a\"><p>Yes, this is a priority for us. We assign one behavior technician per family and work hard to maintain that consistency. Having a familiar face matters deeply to children with autism, and we structure our staffing model around that belief.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li class=\"faq__item\">\n        <button class=\"faq__q\" aria-expanded=\"false\"><span>How do I know if my child needs ABA?<\u002Fspan><span class=\"faq__icon\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq__a\"><p>If your child has a diagnosis of Autism Spectrum Disorder and is struggling with communication, social skills, daily living skills, or behaviors that are getting in the way of learning and connection, ABA may be a good fit. The best first step is to reach out. We are happy to talk through whether our services make sense for your family.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n      <li class=\"faq__item\">\n        <button class=\"faq__q\" aria-expanded=\"false\"><span>What makes Building Bridges ABA different?<\u002Fspan><span class=\"faq__icon\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq__a\"><p>A few things. We are neurodiversity-affirming, which means our goal is never to make your child seem less autistic. We are assent-based, meaning your child's comfort and willingness to participate matter at every session. We assign one consistent behavior technician per family. And we keep our caseloads small and our oversight close. We are not a volume business.<\u002Fp><\u002Fdiv>\n      <\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ JOIN OUR TEAM ============ -->\n<section class=\"section section--cream\" id=\"careers\">\n  <div class=\"container careers\">\n    <div class=\"careers__head\">\n      <span class=\"eyebrow\">Join Our Team<\u002Fspan>\n      <h2 class=\"section__title\">Work that<br>actually matters.<\u002Fh2>\n      <p>\n        We are a growing home-based ABA agency in Northeast Ohio, and we are looking for people who are passionate about making a real difference in children's lives.\n      <\u002Fp>\n      <p>\n        If you are a BCBA or behavior technician who wants to be part of something being built from the ground up, we would love to hear from you. We keep caseloads manageable, prioritize quality over volume, and support our team the way we support our families, with honesty, collaboration, and respect.\n      <\u002Fp>\n      <a href=\"#contact\" class=\"btn btn--primary\">Get in Touch<\u002Fa>\n    <\u002Fdiv>\n\n    <div class=\"careers__roles\">\n      <article class=\"role\" style=\"--accent:#534AB7\">\n        <span class=\"role__tag\">Now Hiring<\u002Fspan>\n        <h3>Board Certified<br>Behavior Analyst<\u002Fh3>\n        <p>BCBA, leading clinical care from assessment through treatment plan.<\u002Fp>\n        <ul class=\"role__meta\">\n          <li><strong>1099<\u002Fstrong> Contractor<\u002Fli>\n          <li><strong>Flexible<\u002Fstrong> Schedule<\u002Fli>\n          <li><strong>Competitive<\u002Fstrong> Rates<\u002Fli>\n          <li><strong>Telehealth<\u002Fstrong> Supervision OK<\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n      <article class=\"role\" style=\"--accent:#43A495\">\n        <span class=\"role__tag\">Now Hiring<\u002Fspan>\n        <h3>Registered Behavior<br>Technician (RBT/BT)<\u002Fh3>\n        <p>Direct, one-on-one care in family homes, supported by a BCBA.<\u002Fp>\n        <ul class=\"role__meta\">\n          <li><strong>W-2<\u002Fstrong> Per-Diem<\u002Fli>\n          <li><strong>Home-Based<\u002Fstrong> Work<\u002Fli>\n          <li><strong>Consistent<\u002Fstrong> Family Assignments<\u002Fli>\n          <li><strong>RBT<\u002Fstrong> Credential Support<\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ CONTACT ============ -->\n<section class=\"section section--contact\" id=\"contact\">\n  <div class=\"container contact\">\n    <div class=\"contact__copy\">\n      <span class=\"eyebrow\">Get in Touch<\u002Fspan>\n      <h2 class=\"section__title\">Let's connect.<\u002Fh2>\n      <p class=\"section__sub\">Whether you are a family seeking services, a physician making a referral, or a school professional, we would love to hear from you.<\u002Fp>\n\n      <div class=\"contact__assurances\">\n        <div>\n          <span class=\"dot\" style=\"background:#43A495\"><\u002Fspan>\n          <strong>1–2 business day<\u002Fstrong> response, typically.\n        <\u002Fdiv>\n        <div>\n          <span class=\"dot\" style=\"background:#0781A0\"><\u002Fspan>\n          We will <strong>walk you through<\u002Fstrong> every step.\n        <\u002Fdiv>\n        <div>\n          <span class=\"dot\" style=\"background:#995CA0\"><\u002Fspan>\n          No pressure. <strong>No sales pitch.<\u002Fstrong>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <form class=\"form\" id=\"contactForm\" action=\"https://formspree.io/f/mzdoqdjd\" method=\"POST\">\n      <div class=\"form__row\">\n        <label class=\"field\">\n          <span>Full Name<\u002Fspan>\n          <input type=\"text\" name=\"name\" required=\"\" autocomplete=\"name\">\n        <\u002Flabel>\n        <label class=\"field\">\n          <span>Email Address<\u002Fspan>\n          <input type=\"email\" name=\"email\" required=\"\" autocomplete=\"email\">\n        <\u002Flabel>\n      <\u002Fdiv>\n      <label class=\"field\">\n        <span>I am a…<\u002Fspan>\n        <div class=\"select\">\n          <select name=\"role\" required=\"\">\n            <option value=\"\">Choose one<\u002Foption>\n            <option>Family / Caregiver<\u002Foption>\n            <option>Physician / Provider<\u002Foption>\n            <option>School Professional<\u002Foption>\n            <option>BCBA or Behavior Technician<\u002Foption>\n            <option>Other<\u002Foption>\n          <\u002Fselect>\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Flabel>\n      <label class=\"field\">\n        <span>Message<\u002Fspan>\n        <textarea name=\"message\" rows=\"5\" required=\"\" placeholder=\"Tell us a bit about what brought you here.\"><\u002Ftextarea>\n      <\u002Flabel>\n      <button type=\"submit\" class=\"btn btn--primary btn--block\">\n        Send Message\n        <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\"><path d=\"M5 12h14M13 5l7 7-7 7\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n      <p class=\"form__note\" id=\"formNote\">We typically respond within one to two business days.<\u002Fp>\n    <\u002Fform>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<!-- ============ FOOTER ============ -->\n<footer class=\"footer\">\n  <div class=\"container footer__inner\">\n    <div class=\"footer__brand\">\n      <span class=\"brand__mark brand__mark--footer\" aria-hidden=\"true\">\n        <img src=\"e47e84a5-ddc4-484b-be56-c6dea4153f29\" alt=\"\" width=\"80\" height=\"50\">\n      <\u002Fspan>\n      <div class=\"footer__name\">\n        <strong>Building Bridges Behavior Therapy, LLC<\u002Fstrong>\n        <span>Home-based ABA therapy in Northeast Ohio<\u002Fspan>\n        <span>Mahoning, Trumbull, and surrounding counties<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"footer__contact\">\n      <span class=\"footer__lbl\">Contact<\u002Fspan>\n      <a href=\"tel:3303330481\">330-333-0481<\u002Fa>\n      <a href=\"#contact\">Send us a message<\u002Fa>\n    <\u002Fdiv>\n\n    <div class=\"footer__links\">\n      <span class=\"footer__lbl\">Policies<\u002Fspan>\n      <a href=\"#\">Privacy Policy<\u002Fa>\n      <a href=\"#\">Notice of Privacy Practices<\u002Fa>\n      <a href=\"#\">Patient Rights<\u002Fa>\n      <a href=\"#\">Nondiscrimination<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"footer__bottom\">\n    <div class=\"container footer__bottom__inner\">\n      <small>© 2026 Building Bridges Behavior Therapy, LLC. All rights reserved.<\u002Fsmall>\n      <small class=\"footer__tag\">\n        <span class=\"dot\" style=\"background:#0781A0\"><\u002Fspan>\n        <span class=\"dot\" style=\"background:#43A495\"><\u002Fspan>\n        <span class=\"dot\" style=\"background:#995CA0\"><\u002Fspan>\n        <span class=\"dot\" style=\"background:#F4932E\"><\u002Fspan>\n        Four figures. One bridge.\n      <\u002Fsmall>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n// Nav scroll state + mobile toggle\n(function () {\n  const nav = document.getElementById('nav');\n  const toggle = document.getElementById('navToggle');\n  const mobile = document.getElementById('navMobile');\n\n  const onScroll = () => {\n    if (window.scrollY > 4) nav.classList.add('is-scrolled');\n    else nav.classList.remove('is-scrolled');\n  };\n  window.addEventListener('scroll', onScroll, { passive: true });\n  onScroll();\n\n  toggle.addEventListener('click', () => {\n    const open = nav.classList.toggle('is-open');\n    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');\n    if (open) mobile.removeAttribute('hidden');\n    else mobile.setAttribute('hidden', '');\n  });\n  mobile.addEventListener('click', (e) => {\n    if (e.target.tagName === 'A') {\n      nav.classList.remove('is-open');\n      toggle.setAttribute('aria-expanded', 'false');\n      mobile.setAttribute('hidden', '');\n    }\n  });\n})();\n\n// FAQ accordion (single-open)\n(function () {\n  const list = document.getElementById('faqList');\n  if (!list) return;\n  list.addEventListener('click', (e) => {\n    const btn = e.target.closest('.faq__q');\n    if (!btn) return;\n    const isOpen = btn.getAttribute('aria-expanded') === 'true';\n    // close any other open items for a tidier feel\n    list.querySelectorAll('.faq__q[aria-expanded=\"true\"]').forEach((b) => {\n      if (b !== btn) b.setAttribute('aria-expanded', 'false');\n    });\n    btn.setAttribute('aria-expanded', isOpen ? 'false' : 'true');\n  });\n})();\n\n// Contact form: progressive enhancement — submit via fetch, show inline thanks state\n(function () {\n  const form = document.getElementById('contactForm');\n  const note = document.getElementById('formNote');\n  if (!form) return;\n\n  form.addEventListener('submit', async (e) => {\n    e.preventDefault();\n    const btn = form.querySelector('button[type=\"submit\"]');\n    const originalText = btn.innerHTML;\n    btn.disabled = true;\n    btn.innerHTML = 'Sending&hellip;';\n    try {\n      const data = new FormData(form);\n      const res = await fetch(form.action, {\n        method: 'POST',\n        body: data,\n        headers: { 'Accept': 'application/json' },\n      });\n      if (res.ok) {\n        form.classList.add('is-sent');\n        btn.innerHTML = 'Message Sent ✓';\n        note.innerHTML = '<strong>Thank you.<\u002Fstrong> We will be in touch within one to two business days.';\n        form.reset();\n      } else {\n        throw new Error('Submit failed');\n      }\n    } catch (err) {\n      btn.disabled = false;\n      btn.innerHTML = originalText;\n      note.innerHTML = 'Something went wrong sending the form. Please try again or call 330-333-0481.';\n    }\n  });\n})();\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
